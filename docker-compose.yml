services:
  wsa:
    build:
      context: ./
    volumes:
      - ./volumes/www:/var/www/html:ro
      - yara-rules:/usr/share/yara-rules:rw
      - ./volumes/third-party:/usr/local/share/src/third-party:ro
      - ./volumes/cache:/usr/share/cache/wordpress-security-audit:rw
      - ./scripts/wsa-auto-add-to-whitelists.sh:/usr/local/bin/wsa-auto-add-to-whitelists.sh:ro
      - ./scripts/sanitize-yara-matched-images.sh:/usr/local/bin/sanitize-yara-matched-images.sh:ro
      - ./scripts/add-to-whitelist.sh:/usr/local/bin/add-to-whitelist.sh:ro

volumes:
  yara-rules:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/yara-rules
